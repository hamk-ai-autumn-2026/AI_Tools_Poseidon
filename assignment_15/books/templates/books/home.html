<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Book Library</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .book {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .book h2 {
            margin-top: 0;
        }

        .book p {
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 16px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 My Book Library</h1>
    <p>Discover and explore my collection of books</p>
</header>

<div class="container">

    <h2>My Books</h2>

    <div class="books">

        {% for book in books %}

        <div class="book">

            <h2>{{ book.title }}</h2>

            <p>
                <strong>Author:</strong>
                {{ book.author }}
            </p>

            <p>
                <strong>Publication year:</strong>
                {{ book.publication_year }}
            </p>

            <p>
                <strong>Genre:</strong>
                {{ book.genre }}
            </p>

            <a class="button"
               href="{% url 'book_detail' book.id %}">
                View details
            </a>

        </div>

        {% empty %}

        <p>No books have been added yet.</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
