<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleido Sketchpad</title>
<meta name="description" content="A symmetry drawing app built with plain HTML, CSS and JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Kaleido Sketchpad</h1>
    <span>draw, mirror, export</span>
  </div>
  <div class="hgroup">
    <button id="undo" title="Undo (Ctrl+Z)" disabled><svg class="icon" viewBox="0 0 24 24"><path d="M3 10h11a5 5 0 0 1 0 10h-4"/><path d="M7 6l-4 4 4 4"/></svg>Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled><svg class="icon" viewBox="0 0 24 24"><path d="M21 10H10a5 5 0 0 0 0 10h4"/><path d="M17 6l4 4-4 4"/></svg>Redo</button>
    <button id="clear" title="Clear canvas"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Clear</button>
    <button id="save" class="primary" title="Download as PNG"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 20h16"/></svg>Save PNG</button>
    <button id="theme" title="Toggle light / dark"><svg class="icon" viewBox="0 0 24 24"><path d="M21 13a8 8 0 1 1-9.9-9.9A7 7 0 0 0 21 13z"/></svg></button>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="base"></canvas>
    <canvas id="preview"></canvas>
    <div id="hint">Pick a tool and start drawing</div>
  </div>
</main>

<div class="panel">
  <div class="group" id="tools">
    <span class="label">Tool</span>
    <button data-tool="brush" class="on" title="Brush (B)">Brush</button>
    <button data-tool="eraser" title="Eraser (E)">Eraser</button>
    <button data-tool="line" title="Line (L)">Line</button>
    <button data-tool="rect" title="Rectangle (R)">Rect</button>
    <button data-tool="ellipse" title="Ellipse (O)">Ellipse</button>
    <button data-tool="fill" title="Flood fill (F)">Fill</button>
  </div>

  <div class="group">
    <span class="label">Colour</span>
    <div class="swatches" id="swatches"></div>
    <input type="color" id="custom" value="#d4432a" title="Custom colour">
  </div>

  <div class="group">
    <span class="label">Size</span>
    <input type="range" id="size" min="1" max="80" value="8">
    <span class="val" id="sizeVal">8</span>
  </div>

  <div class="group">
    <span class="label">Opacity</span>
    <input type="range" id="alpha" min="5" max="100" value="100">
    <span class="val" id="alphaVal">100%</span>
  </div>

  <div class="group">
    <span class="label">Symmetry</span>
    <select id="sym">
      <option value="none">Off</option>
      <option value="v">Mirror ↔</option>
      <option value="h">Mirror ↕</option>
      <option value="quad">Quad</option>
      <option value="6">Mandala ×6</option>
      <option value="12">Mandala ×12</option>
    </select>
  </div>

  <div class="group">
    <span class="label">Paper</span>
    <input type="color" id="paper" value="#ffffff" title="Background colour">
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
